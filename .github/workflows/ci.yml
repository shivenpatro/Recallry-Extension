name: Recallry release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recallry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production extension
        run: npm run build

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: recallry-chrome-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Edge extension smoke test
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download production extension
        uses: actions/download-artifact@v4
        with:
          name: recallry-chrome-${{ github.sha }}
          path: dist

      - name: Test packaged extension in Edge
        run: node scripts/edge-smoke.mjs
