<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Official support and privacy information for the Linkscape browser extension." />
    <title>Linkscape Extension</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #1a1714; background: #f4efe7; }
      * { box-sizing: border-box; }
      body { margin: 0; border-top: 8px solid #e63946; }
      main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
      .index { font: 700 12px/1.4 ui-monospace, monospace; color: #e63946; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0 18px; font: 700 clamp(48px, 10vw, 88px)/.9 Georgia, serif; letter-spacing: 0; }
      p { max-width: 650px; font-size: 18px; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; padding-top: 24px; border-top: 2px solid #1a1714; }
      a { border: 1px solid #1a1714; padding: 12px 16px; color: inherit; font-weight: 700; text-decoration: none; }
      a:hover, a:focus-visible { color: #fff; background: #1a1714; outline: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="index">Official extension information</div>
      <h1>Linkscape</h1>
      <p>Linkscape is a local-first browser extension for saving, organizing, searching, and privately preserving user-selected website references.</p>
      <p>No analytics. No advertising trackers. No sale of user data.</p>
      <nav aria-label="Support links">
        <a href="privacy/">Privacy Policy</a>
        <a href="https://github.com/shivenpatro/Linkscape-Extension">Source and Support</a>
        <a href="https://github.com/shivenpatro/Linkscape-Extension/security">Security</a>
      </nav>
    </main>
  </body>
</html>
